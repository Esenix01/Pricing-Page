<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="pricing.css" />
    <title>Pricing</title>
  </head>
  <body>
    <header>
      <h1>Web hosting</h1>
      <h2>Prices</h2>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Basic</h3>
        <p>$5/month</p>
        <ul>
          <li>1 website</li>
          <li>5 GB storage</li>
          <li>Email support</li>
        </ul>
        <button>Choose</button>
      </div>

      <div class="card featured">
        <h3>Pro</h3>
        <p>$17/month</p>
        <ul>
          <li>5 websites</li>
          <li>50 GB storage</li>
          <li>Priority support</li>
        </ul>
        <button>Choose</button>
      </div>

      <div class="card">
        <h3>Premium</h3>
        <p>$65/month</p>
        <ul>
          <li>Unlimited websites</li>
          <li>500 GB storage</li>
          <li>24/7 support</li>
        </ul>
        <button>Choose</button>
      </div>
    </div>
  </body>
</html>
